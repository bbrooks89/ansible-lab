[defaults]
inventory = inventory/hosts.yml
remote_user = ansible
private_key_file = ~/.ssh/id_ed25519
roles_path = roles
collections_path = /usr/share/ansible/collections
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 10

# Host keys change on every `./lab reset` by design, so don't pin them.
# Never do this against real servers.
host_key_checking = False

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
