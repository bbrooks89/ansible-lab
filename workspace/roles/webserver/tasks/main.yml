---
- name: Load OS-family specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install nginx
  ansible.builtin.package:
    name: "{{ webserver_package }}"
    state: present

- name: Add a response header identifying the host
  ansible.builtin.template:
    src: lab-headers.conf.j2
    dest: /etc/nginx/conf.d/lab-headers.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Publish the landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_root }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Start nginx and enable it at boot
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true

- name: Apply any pending config change before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify the page from the control node
  ansible.builtin.uri:
    url: "http://{{ inventory_hostname }}/"
    return_content: true
  register: webserver_response
  delegate_to: localhost
  become: false
  when: webserver_verify | bool

- name: Assert the right host answered
  ansible.builtin.assert:
    that:
      - inventory_hostname in webserver_response.content
      - webserver_response.x_lab_host == inventory_hostname
    quiet: true
  when: webserver_verify | bool
