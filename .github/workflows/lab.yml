name: lab

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          pip install -r control/requirements.txt ansible-lint
          ansible-galaxy collection install -r control/requirements.yml
      - name: ansible-lint
        working-directory: workspace
        env:
          ANSIBLE_COLLECTIONS_PATH: ~/.ansible/collections
        run: ansible-lint
      - name: Syntax check
        working-directory: workspace
        env:
          ANSIBLE_COLLECTIONS_PATH: ~/.ansible/collections
        run: ansible-playbook --syntax-check playbooks/*.yml

  integration:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Bring the lab up
        run: ./lab up
      - name: Ping
        run: ./lab ping
      - name: First run of site.yml
        run: .github/scripts/run-playbook.sh site.yml first-run.log
      - name: Second run must change nothing (idempotence)
        run: |
          .github/scripts/run-playbook.sh site.yml second-run.log
          if grep -E 'changed=[1-9]' second-run.log; then
            echo "::error title=Not idempotent::$(grep -E -B3 '^changed:' second-run.log | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Pages answer on the host ports
        run: |
          curl -fsS localhost:8081 | grep -q ubuntu1
          curl -fsS localhost:8082 | grep -q rocky1
      - name: Diagnostics on failure
        if: failure()
        run: |
          ./lab status
          docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: ./lab destroy

  terraform-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff
      - name: terraform init
        run: terraform -chdir=terraform init -input=false -backend=false
      - name: terraform validate
        run: terraform -chdir=terraform validate

  integration-terraform:
    runs-on: ubuntu-24.04
    needs: [lint, terraform-lint]
    env:
      LAB: ./lab-tf
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Provision the lab with Terraform
        run: ./lab-tf up
      - name: Ping
        run: ./lab-tf ping
      - name: First run of site.yml
        run: .github/scripts/run-playbook.sh site.yml first-run.log
      - name: Second run must change nothing (idempotence)
        run: |
          .github/scripts/run-playbook.sh site.yml second-run.log
          if grep -E 'changed=[1-9]' second-run.log; then
            echo "::error title=Not idempotent::$(grep -E -B3 '^changed:' second-run.log | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Pages answer on the host ports
        run: |
          curl -fsS localhost:8091 | grep -q ubuntu1
          curl -fsS localhost:8092 | grep -q rocky1
      - name: Terraform shows no drift after apply
        run: |
          terraform -chdir=terraform plan -input=false -detailed-exitcode -no-color -out=drift.tfplan > plan.txt || rc=$?
          if [[ "${rc:-0}" -ne 0 ]]; then
            cat plan.txt
            # Which resources and which attributes want to change, as a readable annotation
            summary=$(terraform -chdir=terraform show -json drift.tfplan | jq -r '
              .resource_changes[] | select(.change.actions != ["no-op"]) |
              "\(.address) \(.change.actions | join(",")): " +
              ([ (.change.before // {}) as $b | (.change.after // {}) as $a |
                 ($b + $a | keys[]) | select($b[.] != $a[.]) ] | join(" "))' | head -c 3000)
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=Terraform drift (exit ${rc})::${summary}"
            exit 1
          fi
      - name: Diagnostics on failure
        if: failure()
        run: |
          ./lab-tf status || true
          for c in $(docker ps -a --filter name=tflab- --format '{{.Names}}'); do
            echo "==== $c"; docker logs --tail 80 "$c" 2>&1 || true
          done
      - name: Tear down
        if: always()
        run: ./lab-tf destroy
